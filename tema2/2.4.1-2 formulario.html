<html>

<head>
    <title>2.4.1-2 Formulario
    </title>
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/INDEX/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/INDEX/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/INDEX/favicon-16x16.png">
    <link rel="manifest" href="../assets/INDEX/site.webmanifest">
</head>

<body>
    <!-- Contenedor del banner -->
    <div style="position: relative;">
        <!-- La imagen de fondo -->
        <img src="../assets/baner.pnj" alt="Banner" style="
            width: 100%; 
            height: 100px; 
            object-fit: cover;
            border-radius: 10px;">

        <!-- El texto flotando encima (centrado) -->
        <h1
            style="position: absolute; top: 22%; width: 100%; text-align: center; color: white; font-size: 50px; margin: 0;">
            2.4.1-2 Formulario
        </h1>
    </div>

    <h1></h1>

    <!--Boton index-->
    <a href="../index.html">
        <button type="button" style="
            background-image: url(../assets/baner.pnj); /* Pon aquí el nombre de tu archivo descargado */
            background-size: cover;                /* Ajusta la imagen para que llene todo el botón */
            background-position: center;           /* Centra la imagen */
            border-radius: 10px;                   /* Hace los bordes redondos (puedes subir el número) */
            color: rgb(255, 255, 255);                          /* Color del texto (cámbialo si no se lee bien) */
            border: 2px solid #1595a6;                /* Mantiene un borde clásico para que parezca un botón normal */
            padding: 10px 20px;                    /* Espacio interno para que el botón sea grande y se vea la foto */
            font-weight: bold;                     /* Hace que el texto resalte sobre la imagen */
            cursor: pointer;
        ">
            INDEX
        </button>
    </a>
    <h1>formulario</h1>
    <form id="miFormulario" action="mailto:correo@defecto.com" method="GET" enctype="text/plain">

        <!-- Primer bloque: Personaje -->
        <fieldset>

            <p>
                <label for="superheroe">superheroe: </label>
                <input list="superheroe" name="superheroe" placeholder="Selecciona uno...">
                <datalist id="superheroe">
                    <!-- Marvel -->
                    <option value="Spider-Man">Spider-Man</option>
                    <option value="Iron Man">Iron Man</option>
                    <option value="Capitán América">Capitán América</option>
                    <option value="Thor">Thor</option>
                    <option value="Hulk">Hulk</option>
                    <option value="Bruja Escarlata">Bruja Escarlata</option>
                    <option value="Black Panther">Black Panther</option>
                    <option value="Doctor Strange">Doctor Strange</option>

                    <!-- DC Comics -->
                    <option value="Batman">Batman</option>
                    <option value="Superman">Superman</option>
                    <option value="Wonder Woman">Wonder Woman</option>
                    <option value="Flash">Flash</option>
                    <option value="Aquaman">Aquaman</option>
                    <option value="Supergirl">Supergirl</option>
                </datalist>
            </p>

            <p>
                <label for="color">Color: </label>
                <input type="color" id="color" name="color">
            </p>
        </fieldset>

        <!-- Segundo bloque: Datos de contacto -->
        <fieldset>
            <legend>Datos de contacto</legend>

            <p>
                <label for="nombre">Nombre completo: </label>
                <input type="text" id="nombre" name="nombre">
            </p>

            <p>
                <label for="correo_destino">Correo electrónico: </label>
                    <input type="email" id="correo_destino" required placeholder="ejemplo@correo.com">
            </p>
            <p>
                <label for="fecha_nacimiento">Fecha de nacimiento:</label>
                    <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>
            </p>
            <p>
                <label for="pais">pais: </label>
                <!-- Menú desplegable para elegir entre varias opciones -->
                <select id="pais" name="pais">
                    <option value="" disabled selected>Selecciona uno...</option>
                    <!-- Europa -->
                    <option value="espana">España</option>
                    <option value="portugal">Portugal</option>
                    <option value="italia">Italia</option>
                    <option value="francia">Francia</option>
                    <option value="alemania">Alemania</option>
                    <option value="reino_unido">Reino Unido</option>

                    <!-- América -->
                    <option value="mexico">México</option>
                    <option value="argentina">Argentina</option>
                    <option value="colombia">Colombia</option>
                    <option value="estados_unidos">Estados Unidos</option>

                    <!-- Asia / Oceanía -->
                    <option value="japon">Japón</option>
                    <option value="australia">Australia</option>
                </select>
            </p>
            <p>
                <label for="telefono">Número de teléfono:</label>
                <input type="tel" id="telefono" name="telefono" placeholder="600 000 000" pattern="[0-9]{9}"
                    title="Introduce un número de 9 dígitos">
            </p>
            <p>
                <label for="archivo">Curriculum: </label>
                <input type="file" id="archivo" name="archivo">
            </p>
        </fieldset>
        <fieldset>
            <legend>Forma de contacto preferida</legend>
            <p>
                <label>
                    <input type="radio" name="contacto" value="Email"> Email
                </label>

                <label>
                    <input type="radio" name="contacto" value="Teléfono"> Telefono
                </label>

                <label>
                    <input type="radio" name="contacto" value="Carta"> Carta
                </label>
            </p>
        </fieldset>
        <fieldset>
            <legend>Asignatura preferida</legend>
            <p>
                <label>
                    <input type="checkbox" name="Asignatura" value="Aplicaciones Web"> Aplicaciones Web
                </label><br>
                <label>
                    <input type="checkbox" name="Asignatura" value="Python"> Python
                </label><br>
                <label>
                    <input type="checkbox" name="Asignatura" value="Servicios en red"> Servicios en red
                </label><br>
            </p>
        </fieldset>

        <!-- Botón de envío -->
        <p>
            <button type="submit">Enviar formulario</button>
        </p>
        <script>
            // Este código cambia el action del formulario justo antes de enviarlo
            document.getElementById('miFormulario').addEventListener('submit', function (event) {
                var emailEscrito = document.getElementById('correo_destino').value;
                this.action = 'mailto:' + emailEscrito;
            });
        </script>
    </form>
</body>
